name: CI

# Pushes to main and pull requests only: a PR branch would otherwise run
# twice (push + pull_request). release.yml calls this workflow before it
# publishes a release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  logic-qt6:
    # Host unit tests for hook/src/shopredirect_logic.h against Qt 6, the major
    # version the hook is built for (Debian bookworm ships 6.4; the device has
    # 6.5.2). Also checks every URL in examples/config.ini.
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        run: apt-get update && apt-get install -y --no-install-recommends qt6-base-dev pkg-config make g++
      - name: Run unit tests
        run: make -C test check

  symbols:
    # Pure Python, no firmware download: every hook, dlsym and allowlisted
    # caller must exist in the 5.18 libnickel symbol reference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check hook symbols against 5.18 libnickel
        run: python3 test/check_symbols.py

  build:
    # ARM cross build in NickelStorygraph's Qt 6.5.2 toolchain image
    # (arm-kobo-linux-gnueabihf). The Qt 5 NickelTC image cannot build this.
    runs-on: ubuntu-latest
    container: ghcr.io/dkuester/nickelstorygraph-toolchain:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # git describe derives the version from the nearest tag.
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build Kobo.tgz
        run: |
          export VERSION="$(git describe --tags --always --dirty)"
          make -C hook
          make -C hook kobo
          tar -tzf hook/Kobo.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: Kobo.tgz
          path: hook/Kobo.tgz
          if-no-files-found: error
