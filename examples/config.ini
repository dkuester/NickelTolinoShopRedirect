; NickelTolinoShopRedirect – Beispielkonfiguration / example configuration
;
; Auf dem tolino: .adds/NickelTolinoShopRedirect/config.ini
; On the tolino:  .adds/NickelTolinoShopRedirect/config.ini
;
; enabled     true/false – Umleitung an/aus (Plugin bleibt installiert)
; start_url   Shop-Knopf, „Weitere Bücher“ am Ende einer Leseprobe
; search_url  Shop-Suche; der Suchbegriff wird angehängt (muss z. B. auf "?q=" enden)
; recommendations  true/false – Empfehlungs-Kacheln auf dem Startbildschirm suchen das Buch
;             (EAN, sonst Titel und Autor) über search_url; false: Artikelseite des eigenen
;             Händlers. Fehlt der Eintrag, gilt true.
;
; Nur https://-Adressen werden akzeptiert; ein ungültiger oder leerer Wert lässt die
; Adresse des eigenen Händlers stehen. Änderungen wirken beim nächsten Öffnen des Shops.
; Only https:// URLs are accepted. Changes apply the next time the shop opens.
;
; Genau EINEN Block aktivieren (die ";" vor start_url/search_url entfernen).
; Enable exactly ONE block (remove the ";" before start_url/search_url).
;
; Quelle der Adressen: öffentliche tolino-Händlerkonfiguration (Stand 2026-10-20)
;   https://api.pageplace.de/v1/resellers/<id>/client-types/TOLINO_SHINE_5/config
;   Felder URL_SHOP_EBOOK_START_PAGE und URL_SHOP_EBOOK_SEARCH
;
; Käufe erscheinen nur dann in der Bibliothek, wenn das Konto des Shops mit dem Konto
; des Geräts verbunden ist („Konten verbinden“ in der tolino-Kontoverwaltung).

[shop]
enabled=true
recommendations=true

; --- Deutschland -------------------------------------------------------------

; meineBUCHhandlung (Libri, unabhängige Buchhandlungen) – id 80 – Voreinstellung/default
start_url=https://mt.shop-asp.de/de/
